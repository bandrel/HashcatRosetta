name: accuracy

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"  # nightly 04:17 UTC
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install hashcat
        run: |
          sudo apt-get update
          sudo apt-get install -y hashcat
          hashcat --version
      - name: Build hashcat-utils generate-rules.bin
        run: |
          # Pin to a commit known to build cleanly.
          git clone https://github.com/hashcat/hashcat-utils.git ~/hashcat-utils
          cd ~/hashcat-utils
          git checkout 8bbf2baf7b341c8ec23ca91e44e0ac7d7fcc0355  # post-v1.9; Makefile builds bin/*.bin
          make generate-rules.bin
          ls ~/hashcat-utils/bin/generate-rules.bin
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run accuracy smoke (50 rules x 24 basewords)
        # Scope sized to fit comfortably inside timeout-minutes. POCL on
        # ubuntu-latest rebuilds the OpenCL kernel on every hashcat
        # invocation, dominating per-call cost. The original 200x24 spec
        # didn't finish in 30m. Nightly does the larger sweep.
        run: |
          uv run python scripts/verify_rules.py --count 50 --seed 42 \
            --basewords tests/data/basewords.json \
            --report accuracy-smoke.json

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install hashcat
        run: |
          sudo apt-get update
          sudo apt-get install -y hashcat
          hashcat --version
      - name: Build hashcat-utils generate-rules.bin
        run: |
          git clone https://github.com/hashcat/hashcat-utils.git ~/hashcat-utils
          cd ~/hashcat-utils
          git checkout 8bbf2baf7b341c8ec23ca91e44e0ac7d7fcc0355  # post-v1.9; Makefile builds bin/*.bin
          make generate-rules.bin
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run accuracy full (500 rules x 24 basewords)
        # Sized for the 60-minute timeout against POCL on ubuntu-latest:
        # each hashcat invocation rebuilds the OpenCL kernel, so per-call
        # cost is ~200ms after warmup. 500 rules x 24 basewords = 12000
        # invocations, ~40 min on the runner. The original 10000x5x24 spec
        # (1.2M invocations) would have needed ~6 days. If the runner gets
        # faster or we batch into one hashcat call per baseword, scope back up.
        run: |
          uv run python scripts/verify_rules.py --count 500 --rounds 1 \
            --basewords tests/data/basewords.json \
            --report accuracy-nightly.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-nightly-report
          path: accuracy-nightly.json
