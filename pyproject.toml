[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hashcatrosetta"
version = "0.1.0"
description = "Analyze hashcat debug output to identify efficient rules and baseword patterns"

readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Justin Bollinger", email = "justin.bollinger@trustedsec.com"}
]

dependencies = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
     "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "ruff>=0.6.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.scripts]
rosetta = "hashcat_rosetta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hashcat_rosetta"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests that verify against actual hashcat binary",
]
