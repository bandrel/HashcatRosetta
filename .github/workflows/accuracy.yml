name: accuracy

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"  # nightly 04:17 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: >-
          Reproduce a nightly run with this exact seed. Leave blank to run
          the quick smoke + opcode-sweep checks; provide a seed to re-run
          the full nightly sweep deterministically (the seed of any run is
          printed in its job summary).
        required: false
        default: ""

jobs:
  smoke:
    # PRs always; manual runs only when NOT reproducing a nightly (no seed).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install hashcat
        run: |
          # Ubuntu's apt hashcat is v6.2.6 (2022), which predates the 'B'
          # (add byte value) and 'v' (insert every) rule ops added in v7.1.2.
          # The opcode sweep needs an oracle that implements every modeled
          # opcode, so overlay the upstream v7.1.2 release on top of the apt
          # package (apt still sets up the POCL OpenCL ICD and dependencies).
          sudo apt-get update
          sudo apt-get install -y hashcat p7zip-full
          curl -fsSL https://hashcat.net/files/hashcat-7.1.2.7z -o /tmp/hashcat.7z
          echo "80db0316387794ce9d14ed376da75b8a7742972485b45db790f5f8260307ff98  /tmp/hashcat.7z" | sha256sum -c -
          7z x -y /tmp/hashcat.7z -o/opt >/dev/null
          sudo ln -sf /opt/hashcat-7.1.2/hashcat.bin /usr/local/bin/hashcat
          hashcat --version
      - name: Build hashcat-utils generate-rules.bin
        run: |
          # Pin to a commit known to build cleanly.
          git clone https://github.com/hashcat/hashcat-utils.git ~/hashcat-utils
          cd ~/hashcat-utils
          git checkout 8bbf2baf7b341c8ec23ca91e44e0ac7d7fcc0355  # post-v1.9; Makefile builds bin/*.bin
          make generate-rules.bin
          ls ~/hashcat-utils/bin/generate-rules.bin
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run accuracy smoke (50 rules x 24 basewords)
        # Scope sized to fit comfortably inside timeout-minutes. POCL on
        # ubuntu-latest rebuilds the OpenCL kernel on every hashcat
        # invocation, dominating per-call cost. The original 200x24 spec
        # didn't finish in 30m. Nightly does the larger sweep.
        run: |
          uv run python scripts/verify_rules.py --count 50 --seed 42 \
            --basewords tests/data/basewords.json \
            --report accuracy-smoke.json

  opcode-sweep:
    # PRs always; manual runs only when NOT reproducing a nightly (no seed).
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install hashcat
        run: |
          # Ubuntu's apt hashcat is v6.2.6 (2022), which predates the 'B'
          # (add byte value) and 'v' (insert every) rule ops added in v7.1.2.
          # The opcode sweep needs an oracle that implements every modeled
          # opcode, so overlay the upstream v7.1.2 release on top of the apt
          # package (apt still sets up the POCL OpenCL ICD and dependencies).
          sudo apt-get update
          sudo apt-get install -y hashcat p7zip-full
          curl -fsSL https://hashcat.net/files/hashcat-7.1.2.7z -o /tmp/hashcat.7z
          echo "80db0316387794ce9d14ed376da75b8a7742972485b45db790f5f8260307ff98  /tmp/hashcat.7z" | sha256sum -c -
          7z x -y /tmp/hashcat.7z -o/opt >/dev/null
          sudo ln -sf /opt/hashcat-7.1.2/hashcat.bin /usr/local/bin/hashcat
          hashcat --version
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run opcode sweep
        # Systematic per-opcode correctness sweep. Identifies latent opcode
        # bugs deterministically (no random seeding). Fails the build only
        # when a mismatch appears on an opcode NOT in KNOWN_LATENT.
        # No generate-rules.bin dependency — sweep generates its own rules.
        run: |
          uv run python scripts/sweep_opcodes.py \
            --report reports/opcode-sweep.md \
            --json opcode-sweep.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opcode-sweep-report
          path: |
            reports/opcode-sweep.md
            opcode-sweep.json

  nightly:
    # Scheduled nightly, or a manual reproduction run when a seed is given.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.seed != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install hashcat
        run: |
          # Ubuntu's apt hashcat is v6.2.6 (2022), which predates the 'B'
          # (add byte value) and 'v' (insert every) rule ops added in v7.1.2.
          # The opcode sweep needs an oracle that implements every modeled
          # opcode, so overlay the upstream v7.1.2 release on top of the apt
          # package (apt still sets up the POCL OpenCL ICD and dependencies).
          sudo apt-get update
          sudo apt-get install -y hashcat p7zip-full
          curl -fsSL https://hashcat.net/files/hashcat-7.1.2.7z -o /tmp/hashcat.7z
          echo "80db0316387794ce9d14ed376da75b8a7742972485b45db790f5f8260307ff98  /tmp/hashcat.7z" | sha256sum -c -
          7z x -y /tmp/hashcat.7z -o/opt >/dev/null
          sudo ln -sf /opt/hashcat-7.1.2/hashcat.bin /usr/local/bin/hashcat
          hashcat --version
      - name: Build hashcat-utils generate-rules.bin
        run: |
          git clone https://github.com/hashcat/hashcat-utils.git ~/hashcat-utils
          cd ~/hashcat-utils
          git checkout 8bbf2baf7b341c8ec23ca91e44e0ac7d7fcc0355  # post-v1.9; Makefile builds bin/*.bin
          make generate-rules.bin
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Sync dependencies
        run: uv sync
      - name: Run accuracy full (500 rules x 24 basewords)
        # Sized for the 60-minute timeout against POCL on ubuntu-latest:
        # each hashcat invocation rebuilds the OpenCL kernel, so per-call
        # cost is ~200ms after warmup. 500 rules x 24 basewords = 12000
        # invocations, ~40 min on the runner. The original 10000x5x24 spec
        # (1.2M invocations) would have needed ~6 days. If the runner gets
        # faster or we batch into one hashcat call per baseword, scope back up.
        #
        # The workflow owns seed selection so the exact seed is recorded in
        # the job summary and can be replayed via workflow_dispatch. INPUT_SEED
        # is passed through env (never interpolated into the shell) and is
        # validated as numeric before use.
        env:
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SEED}" ]; then
            if ! printf '%s' "${INPUT_SEED}" | grep -Eq '^[0-9]+$'; then
              echo "::error::seed input must be a non-negative integer, got: ${INPUT_SEED}"
              exit 1
            fi
            SEED="${INPUT_SEED}"
          else
            SEED=$(( $(date +%s) % 100000 ))
          fi
          echo "Using seed=${SEED}"
          {
            echo "### Accuracy nightly"
            echo ""
            echo "- **seed:** \`${SEED}\`"
            echo "- **reproduce:** Actions → accuracy → Run workflow → seed \`${SEED}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          uv run python scripts/verify_rules.py --count 500 --rounds 1 \
            --seed "${SEED}" \
            --basewords tests/data/basewords.json \
            --report accuracy-nightly.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-nightly-report
          path: accuracy-nightly.json
